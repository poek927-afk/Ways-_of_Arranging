<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quests</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="quests.css"/>
</head>
<body>
 
  
  <div class="bg">
    <img src="fanstasy-bg.jpg"
         alt="Fantasy landscape background"/>
  </div>
 

  <section class="panel">
 
   
    <header>
      <div class="title-text">Quests</div>
    </header>
 
   
    <section class="columns">
 
    
      <div class="quest-list">
        <button class="quest-btn active">A Hurt Farmer</button>
        <button class="quest-btn">Prisoner Escape</button>
        <button class="quest-btn">Monster Attack</button>
        <button class="quest-btn">Defend the Village</button>
        <button class="quest-btn">Sword Training</button>
        <button class="quest-btn">The Missing Horse</button>
      </div>
 
     
      <div class="quest-detail">
        <div class="detail-title">A Hurt Farmer</div>
        <div class="detail-body">
          A farmer has been attacked by bandits and has offered a bounty
          to catch them. Head to Barrows farm to begin the quest.
        </div>
      </div>
 
    </section>
 
  </section>
 
  <script src="quests.js"></script>
</body>
</html>
