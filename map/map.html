<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="map.css"/>
</head>
<body>
 
    <div class="bg">
    <img src="fanstasy-bg.jpg" alt="World map background"/>
  </div>

  <header class="topbar">
    <div class="compass">
      <img src="https://api.iconify.design/mdi/compass-rose.svg?color=%23c9a84c" alt="Compass"/>
    </div>
    <div class="region-name">Dusty Creek Territory</div>
    <div class="save-point">
      <img src="https://api.iconify.design/mdi/campfire.svg?color=%23c9a84c" alt="Save"/>
      <div class="save-label">Camp Site</div>
    </div>
  </header>

  <section class="map-options">
    <button class="map-btn active">World Map</button>
    <button class="map-btn">Region Map</button>
    <button class="map-btn">Town Map</button>
  </section>

  <div class="bottombar">
    <button class="nav-btn" id="btn-prev">
      <img src="https://api.iconify.design/mdi/arrow-left.svg?color=%23c0392b" alt="Left arrow"/>
      <div>Previous Territory</div>
    </button>
    <button class="nav-btn" id="btn-next">
      <div>Next Territory</div>
      <img src="https://api.iconify.design/mdi/arrow-right.svg?color=%23c0392b" alt="Right arrow"/>
    </button>
  </div>

   <script src="map.js"></script>
</body>
</html>
