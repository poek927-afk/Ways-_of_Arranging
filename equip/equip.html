<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Equip Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="equip.css"/>
</head>
<body>

    <div class="bg">
    <img src="https://static.vecteezy.com/system/resources/thumbnails/021/100/565/small_2x/fantasy-world-game-background-free-vector.jpg"
         alt="Mario-style background"/>
  </div>

  <section class="panel">

        <section class="columns">

            <div class="equipped-side">
        <header>
          <div class="title-text">Equipped</div>
        </header>

         <div class="slot-grid">
          <div class="slot-row">
            <button class="slot empty" data-slot="head-left"></button>
            <button class="slot active" data-slot="head">🍄</button>
            <button class="slot empty" data-slot="head-right"></button>
          </div>
          <div class="slot-row">
            <button class="slot" data-slot="left-hand">🌟</button>
            <div class="body-icon">🧑</div>
            <button class="slot" data-slot="right-hand">🔥</button>
          </div>
          <div class="slot-row">
            <button class="slot empty" data-slot="leg-left"></button>
            <button class="slot" data-slot="boots">👢</button>
            <button class="slot empty" data-slot="leg-right"></button>

             </div>
          <div class="slot-row center">
            <button class="slot" data-slot="tool">🔭</button>
          </div>
        </div>
      </div>

      <div class="backpack-side">
        <header>
          <div class="title-text">Backpack</div>
        </header>
 
        <div class="backpack-list">
          <button class="item-btn" data-item="Super Mushroom">🍄 Super Mushroom</button>
          <button class="item-btn" data-item="Fire Flower">🔥 Fire Flower</button>
           <button class="item-btn" data-item="Super Star">🌟 Super Star</button>
          <button class="item-btn" data-item="Cape Feather">🪶 Cape Feather</button>
          <button class="item-btn" data-item="Mega Mushroom">🍄 Mega Mushroom</button>
        </div>
      </div>
 
    </section>

    <div class="info-bar">
      <div class="info-text">Select an item to equip it.</div>
    </div>
 
  </section>
 
  <script src="equip.js"></script>
</body>
</html>
